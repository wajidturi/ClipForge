[project]
name = "clipforge"
version = "0.1.0"
description = "Turns long videos and live streams into finished vertical Shorts."
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "structlog>=24.4",
    "psutil>=6.1",
    "httpx>=0.28",
    "yt-dlp[default,deno]>=2026.10.26",
    "python-multipart>=0.0.34",
    # Phase 3: transcription + signals
    "numpy>=2.0",
    "faster-whisper==1.2.1",
    "av==18.1.0",  # av 19 drops metadata_errors, which faster-whisper 1.2.1 still passes
    # mediapipe needs the contrib build; it is a superset of opencv-python, which is
    # blocked below so the two never overwrite the same `cv2` folder.
    "opencv-contrib-python>=5.0",
    "mediapipe==1.2.3",
    "scenedetect>=0.6.5",
    "rapidocr-onnxruntime>=1.4",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
# NVIDIA GPU (Windows/Linux): CUDA 12 libraries for faster-whisper. ~2 GB.
gpu = ["nvidia-cublas-cu12", "nvidia-cudnn-cu12==9.*"]

[project.scripts]
clipforge = "clipforge.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "psycopg[binary]>=3.2",
    "httpx2>=2.16.2",
]

[tool.uv]
# Only pick package versions that ship wheels for both desktop targets
# (e.g. the newest nvidia-cublas is Linux-only).
required-environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
# rapidocr and scenedetect ask for opencv-python; opencv-contrib-python (needed by
# mediapipe) provides the same `cv2` module, so never install the plain build.
override-dependencies = ["opencv-python; sys_platform == 'never'"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clipforge"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "N", "ASYNC"]
ignore = ["S101", "S603", "S607", "RUF012"]

[tool.ruff.lint.isort]
known-first-party = ["clipforge"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]
"migrations/**" = ["E501", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["clipforge"]

[[tool.mypy.overrides]]
module = [
    "psutil.*",
    "yt_dlp.*",
    "ctranslate2.*",
    "faster_whisper.*",
    "mediapipe.*",
    "scenedetect.*",
    "rapidocr_onnxruntime.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "postgres: needs CF_TEST_POSTGRES_URL",
    "network: real downloads; needs CF_TEST_NETWORK=1",
    "real_ml: real speech model / vision models (slow; downloads models on first run)",
]
addopts = "-ra"
