# Install once: cd backend && uv run pre-commit install   (runs on every git commit)
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
        exclude: ^frontend/tsconfig.*\.json$
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key

  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format (backend)
        entry: uv run --project backend ruff format --config backend/pyproject.toml
        language: system
        types: [python]
      - id: ruff
        name: ruff lint (backend)
        entry: uv run --project backend ruff check --fix --config backend/pyproject.toml
        language: system
        types: [python]
      - id: prettier
        name: prettier (frontend)
        entry: npm --prefix frontend exec -- prettier --write --ignore-unknown
        language: system
        files: ^frontend/src/
      - id: oxlint
        name: oxlint (frontend)
        entry: npm --prefix frontend run lint
        language: system
        files: ^frontend/src/.*\.(ts|tsx)$
        pass_filenames: false
